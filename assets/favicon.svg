<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Vanta Haven">
  <!-- C4, the mark alone. Hollow diamond carrying the mint-to-sand ramp.
       The stroke is deliberately heavier than the wordmark's .09em: at 16px a
       proportional edge falls below one device pixel and vanishes. -->
  <defs>
    <linearGradient id="vh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4FD1B9"/>
      <stop offset="1" stop-color="#E5BB6E"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#07100F"/>
  <rect x="18" y="18" width="28" height="28" rx="2"
        transform="rotate(45 32 32)"
        fill="none" stroke="url(#vh)" stroke-width="6.5"/>
</svg>
